<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Essentials Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #306998;
            --secondary-color: #ffd43b;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-top: 5px solid var(--secondary-color);
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--primary-color);
            font-size: 24px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #7f8c8d;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #edf2f7;
            border-color: var(--primary-color);
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }

        .next-btn:hover {
            background-color: #245175;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .score-text {
            font-size: 20px;
            margin-bottom: 24px;
        }

        .restart-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>Python Programming Quiz</h1>
        
        <div id="quiz-box">
            <div class="quiz-header">
                <span id="question-counter">Question 1 of 10</span>
                <span id="score-counter">Score: 0</span>
            </div>
            <div class="question-text" id="question-text">
                Loading question...
            </div>
            <div class="options-container" id="options-container"></div>
            <div class="controls">
                <button class="next-btn" id="next-btn">Next Question</button>
            </div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>Quiz Completed!</h2>
            <p class="score-text">You scored <span id="final-score">0</span> out of <span id="total-questions">0</span></p>
            <button class="restart-btn" id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "Which of the following is the correct extension for a Python file?",
                options: [".pt", ".py", ".pyt", ".python"],
                correct: 1
            },
            {
                question: "How do you create a variable with the numeric value 5 in Python?",
                options: ["x = 5", "int x = 5", "x := 5", "var x = 5"],
                correct: 0
            },
            {
                question: "What is the correct syntax to output 'Hello World' in Python?",
                options: ["echo('Hello World')", "print('Hello World')", "p('Hello World')", "System.out.println('Hello World')"],
                correct: 1
            },
            {
                question: "Which data type in Python is mutable (can be changed)?",
                options: ["tuple", "string", "list", "int"],
                correct: 2
            },
            {
                question: "How do you start a comment block in Python?",
                options: ["// comment", "/* comment */", "<!-- comment -->", "# comment"],
                correct: 3
            },
            {
                question: "What is the output of print(2 ** 3) in Python?",
                options: ["6", "8", "9", "5"],
                correct: 1
            },
            {
                question: "Which keyword is used to define a function in Python?",
                options: ["func", "function", "def", "define"],
                correct: 2
            },
            {
                question: "How do you check the length of a list named 'mylist' in Python?",
                options: ["mylist.length()", "len(mylist)", "length(mylist)", "mylist.size"],
                correct: 1
            },
            {
                question: "Which collection data type is ordered, unchangeable, and allows duplicate members?",
                options: ["set", "dictionary", "list", "tuple"],
                correct: 3
            },
            {
                question: "What statement is used to stop a loop prematurely in Python?",
                options: ["exit", "stop", "break", "return"],
                correct: 2
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const questionCounter = document.getElementById("question-counter");
        const scoreCounter = document.getElementById("score-counter");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const finalScore = document.getElementById("final-score");
        const totalQuestions = document.getElementById("total-questions");
        const restartBtn = document.getElementById("restart-btn");

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultBox.style.display = "none";
            quizBox.style.display = "block";
            scoreCounter.textContent = `Score: ${score}`;
            loadQuestion();
        }

        function loadQuestion() {
            resetState();
            const currentData = quizData[currentQuestionIndex];
            
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            questionText.textContent = currentData.question;

            currentData.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.textContent = option;
                button.classList.add("option-btn");
                button.addEventListener("click", () => selectAnswer(index, button));
                optionsContainer.appendChild(button);
            });
        }

        function resetState() {
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = "";
        }

        function selectAnswer(selectedIndex, selectedButton) {
            const correctAnswerIndex = quizData[currentQuestionIndex].correct;
            const allButtons = optionsContainer.querySelectorAll(".option-btn");

            if (selectedIndex === correctAnswerIndex) {
                selectedButton.classList.add("correct");
                score++;
                scoreCounter.textContent = `Score: ${score}`;
            } else {
                selectedButton.classList.add("wrong");
                allButtons[correctAnswerIndex].classList.add("correct");
            }

            allButtons.forEach(btn => btn.disabled = true);
            nextBtn.style.display = "block";
        }

        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            finalScore.textContent = score;
        }
