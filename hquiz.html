<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        body {
            background-color: #f5f7fb;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 24px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #7f8c8d;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-label {
            display: flex;
            align-items: center;
            background-color: #f8f9fa;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-label:hover {
            background-color: #edf2f7;
            border-color: #4a90e2;
        }

        .option-label input[type="radio"] {
            margin-right: 15px;
            transform: scale(1.3);
            cursor: pointer;
        }

        .option-label.active-selected {
            background-color: #e3f2fd !important;
            border-color: #4a90e2 !important;
        }

        .option-label.correct {
            background-color: #d4edda !important;
            border-color: #2ecc71 !important;
            color: #155724;
        }

        .option-label.wrong {
            background-color: #f8d7da !important;
            border-color: #e74c3c !important;
            color: #721c24;
        }

        .controls {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: #4a90e2;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .next-btn:hover {
            background-color: #357abd;
        }

        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #4a90e2;
        }

        .score-text {
            font-size: 20px;
            margin-bottom: 24px;
        }

        .restart-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>HTML & CSS Quiz</h1>
        
        <div id="quiz-box">
            <div class="quiz-header">
                <span id="question-counter">Question 1 of 20</span>
                <span id="score-counter">Score: 0</span>
            </div>
            
            <div class="question-text" id="question-text">What does HTML stand for?</div>
            
            <div class="options-container" id="options-container">
                <label class="option-label"><input type="radio" name="quiz-ans" value="0"><span>Hyper Text Markup Language</span></label>
                <label class="option-label"><input type="radio" name="quiz-ans" value="1"><span>Home Tool Markup Language</span></label>
                <label class="option-label"><input type="radio" name="quiz-ans" value="2"><span>Hyperlinks and Text Measurement Language</span></label>
                <label class="option-label"><input type="radio" name="quiz-ans" value="3"><span>Hyper Tool Market Language</span></label>
            </div>
            
            <div class="controls">
                <button class="next-btn" id="next-btn">Submit Answer</button>
            </div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>Quiz Completed!</h2>
            <p class="score-text">You scored <span id="final-score">0</span> out of <span id="total-questions">0</span></p>
            <button class="restart-btn" id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                question: "What does HTML stand for?",
                options: ["Hyper Text Markup Language", "Home Tool Markup Language", "Hyperlinks and Text Measurement Language", "Hyper Tool Market Language"],
                correct: 0
            },
            {
                question: "Which HTML element is used for the largest heading?",
                options: ["<h6>", "<heading>", "<h1>", "<head>"],
                correct: 2
            },
            {
                question: "What is the correct HTML element for inserting a line break?",
                options: ["<br>", "<lb>", "<break>", "<line>"],
                correct: 0
            },
            {
                question: "Which character is used to indicate an end tag in HTML?",
                options: ["*", "<", "^", "/"],
                correct: 3
            },
            {
                question: "Which attribute is used to provide an alternative text for an image?",
                options: ["title", "alt", "src", "longdesc"],
                correct: 1
            },
            {
                question: "What is the correct HTML for creating a hyperlink?",
                options: ["<a href='url'>Example</a>", "<a url='url'>Example</a>", "<a>url</a>", "<link href='url'>Example</link>"],
                correct: 0
            },
            {
                question: "Which HTML element is used to define an unordered list?",
                options: ["<ol>", "<ul>", "<list>", "<dl>"],
                correct: 1
            },
            {
                question: "Which HTML element defines a table row?",
                options: ["<td>", "<th>", "<row>", "<tr>"],
                correct: 3
            },
            {
                question: "In HTML, which element is used to define important text structurally?",
                options: ["<important>", "<b>", "<strong>", "<i>"],
                correct: 2
            },
            {
                question: "Which HTML5 element is used to display a self-contained article?",
                options: ["<section>", "<article>", "<aside>", "<body>"],
                correct: 1
            },
            {
                question: "What does CSS stand for?",
                options: ["Creative Style Sheets", "Computer Style Sheets", "Cascading Style Sheets", "Colorful Style Sheets"],
                correct: 2
            },
            {
                question: "Which CSS property is used to change the text color of an element?",
                options: ["text-color", "fgcolor", "color", "font-color"],
                correct: 2
            },
            {
                question: "Which CSS property controls the text size?",
                options: ["font-style", "text-size", "font-size", "text-style"],
                correct: 2
            },
            {
                question: "What is the correct CSS syntax to make all p elements bold?",
                options: ["p {font-weight: bold;}", "p {text-size: bold;}", "p style='font-size: bold;'", "p {font: bold;}"],
                correct: 0
            },
            {
                question: "How do you select an element with the id 'demo' in CSS?",
                options: [".demo", "#demo", "demo", "*demo"],
                correct: 1
            },
            {
                question: "How do you select elements with the class name 'test' in CSS?",
                options: ["#test", "*test", "test", ".test"],
                correct: 3
            },
            {
                question: "Which CSS property is used to change the left margin of an element?",
                options: ["padding-left", "margin-left", "indent-left", "margin: left;"],
                correct: 1
            },
            {
                question: "In the CSS Box Model, which property creates space outside of an element's border?",
                options: ["padding", "margin", "spacing", "content"],
                correct: 1
            },
            {
                question: "Which CSS property is used to display a border around an element?",
                options: ["border-style", "border-width", "border-color", "border"],
                correct: 3
            },
            {
                question: "Which CSS property is used to change the font family of an element?",
                options: ["font-family", "font-style", "typeface", "font-type"],
                correct: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let isAnswered = false;

 const quizBox = document.getElementById("quiz-box");const resultBox = document.getElementById("result-box");const questionCounter = document.getElementById("question-counter");const scoreCounter = document.getElementById("score-counter");const questionText = document.getElementById("question-text");const optionsContainer = document.getElementById("options-container");const nextBtn = document.getElementById("next-btn");const finalScore = document.getElementById("final-score");const totalQuestions = document.getElementById("total-questions");const restartBtn = document.getElementById("restart-btn");function startQuiz() {currentQuestionIndex = 0;score = 0;resultBox.style.display = "none";quizBox.style.display = "block";scoreCounter.textContent = "Score: " + score;loadQuestion();}function loadQuestion() {isAnswered = false;nextBtn.textContent = "Submit Answer";optionsContainer.innerHTML = "";const currentData = quizData[currentQuestionIndex];questionCounter.textContent = "Question " + (currentQuestionIndex + 1) + " of " + quizData.length;questionText.textContent = currentData.question;currentData.options.forEach((option, index) => {const label = document.createElement("label");label.classList.add("option-label");const radio = document.createElement("input");radio.type = "radio";radio.name = "quiz-ans";radio.value = index;const textSpan = document.createElement("span");textSpan.textContent = option;label.appendChild(radio);label.appendChild(textSpan);optionsContainer.appendChild(label);});setupRadioClickHandlers();}function setupRadioClickHandlers() {const labels = optionsContainer.querySelectorAll(".option-label");labels.forEach(label => {label.addEventListener("click", function() {if (isAnswered) return;labels.forEach(l => l.classList.remove("active-selected"));this.classList.add("active-selected");const radio = this.querySelector('input[type="radio"]');if (radio) radio.checked = true;});});}function evaluateSelection() {const checkedRadio = optionsContainer.querySelector('input[name="quiz-ans"]:checked');if (!checkedRadio) {alert("Please pick an option first!");return;}isAnswered = true;const selectedIndex = parseInt(checkedRadio.value);const correctAnswerIndex = quizData[currentQuestionIndex].correct;const labels = optionsContainer.querySelectorAll(".option-label");labels.forEach((label, idx) => {label.classList.remove("active-selected");const currentRadio = label.querySelector('input[type="radio"]');if (currentRadio) currentRadio.disabled = true;if (idx === correctAnswerIndex) {label.classList.add("correct");} else if (idx === selectedIndex) {label.classList.add("wrong");}});if (selectedIndex === correctAnswerIndex) {score++;scoreCounter.textContent = "Score: " + score;}nextBtn.textContent = (currentQuestionIndex === quizData.length - 1) ? "Finish Quiz" : "Next Question";}nextBtn.addEventListener("click", function() {if (!isAnswered) {evaluateSelection();} else {currentQuestionIndex++;if (currentQuestionIndex < quizData.length) {loadQuestion();} else {showResults();}}});function showResults() {quizBox.style.display = "none";resultBox.style.display = "block";finalScore.textContent = score;totalQuestions.textContent = quizData.length;}restartBtn.addEventListener("click", startQuiz);document.addEventListener('copy', function(e) {e.stopPropagation();}, true);startQuiz();
