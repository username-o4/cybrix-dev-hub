<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Quiz</title>
    <style>
        /* Base Reset & Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Quiz Container */
        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 24px;
        }

        /* Score Tracker & Question */
        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #7f8c8d;
        }

        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Option Buttons */
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .option-btn:hover:not([disabled]) {
            background-color: #edf2f7;
            border-color: var(--primary-color);
        }

        /* State Classes managed via JS */
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: none; /* Hidden until answer is selected */
        }

        .next-btn:hover {
            background-color: #357abd;
        }

        /* Results Section */
        .result-screen {
            text-align: center;
            display: none;
        }

        .result-screen h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .score-text {
            font-size: 20px;
            margin-bottom: 24px;
        }

        .restart-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <!-- Active Quiz UI -->
        <div id="quiz-box">
            <div class="quiz-header">
                <span id="question-counter">Question 1 of 3</span>
                <span id="score-counter">Score: 0</span>
            </div>
            <div class="question-text" id="question-text">
                Loading question...
            </div>
            <div class="options-container" id="options-container">
                <!-- Buttons dynamically loaded by JS -->
            </div>
            <div class="controls">
                <button class="next-btn" id="next-btn">Next Question</button>
            </div>
        </div>

        <!-- End Game Screen -->
        <div id="result-box" class="result-screen">
            <h2>Quiz Completed!</h2>
            <p class="score-text">You scored <span id="final-score">0</span> out of <span id="total-questions">0</span></p>
            <button class="restart-btn" id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script>
        // Quiz Questions Data Structure
        const quizData = [
            {
                question: "What does HTML stand for?",
                options: [
                    "Hyper Text Markup Language",
                    "Home Tool Markup Language",
                    "Hyperlinks and Text Measurement Language",
                    "Hyper Tool Market Language"
                ],
                correct: 0
            },
            {
                question: "Which CSS property is used to change the background color?",
                options: [
                    "color",
                    "bgcolor",
                    "background-color",
                    "canvas-color"
                ],
                correct: 2
            },
            {
                question: "Which HTML tag is used to define an internal style sheet?",
                options: [
                    "<script>",
                    "<css>",
                    "<style>",
                    "<link>"
                ],
                correct: 2
            }
        ];

        // State Tracking
        let currentQuestionIndex = 0;
        let score = 0;

        // DOM Element Selections
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const questionCounter = document.getElementById("question-counter");
        const scoreCounter = document.getElementById("score-counter");
        const questionText = document.getElementById("question-text");
        const optionsContainer = document.getElementById("options-container");
        const nextBtn = document.getElementById("next-btn");
        const finalScore = document.getElementById("final-score");
        const totalQuestions = document.getElementById("total-questions");
        const restartBtn = document.getElementById("restart-btn");

        // Initialize App
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultBox.style.display = "none";
            quizBox.style.display = "block";
            scoreCounter.textContent = `Score: ${score}`;
            loadQuestion();
        }

        // Render Current Question
        function loadQuestion() {
            resetState();
            const currentData = quizData[currentQuestionIndex];
            
            // Set Text
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            questionText.textContent = currentData.question;

            // Render Option Buttons
            currentData.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.textContent = option;
                button.classList.add("option-btn");
                button.addEventListener("click", () => selectAnswer(index, button));
                optionsContainer.appendChild(button);
            });
        }

        // Clean up visual states before loading next question
        function resetState() {
            nextBtn.style.display = "none";
            optionsContainer.innerHTML = "";
        }

        // Handle Choice Selection
        function selectAnswer(selectedIndex, selectedButton) {
            const correctAnswerIndex = quizData[currentQuestionIndex].correct;
            const allButtons = optionsContainer.querySelectorAll(".option-btn");

            // Evaluate answer
            if (selectedIndex === correctAnswerIndex) {
                selectedButton.classList.add("correct");
                score++;
                scoreCounter.textContent = `Score: ${score}`;
            } else {
                selectedButton.classList.add("wrong");
                // Reveal correct answer to the user
                allButtons[correctAnswerIndex].classList.add("correct");
            }

            // Disable further choice clicks
            allButtons.forEach(btn => btn.disabled = true);
            
            // Display advance button
            nextBtn.style.display = "block";
        }

        // Advance to next screen
        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Render Completion State
        function showResults() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            finalScore.textContent = score;
            totalQuestions.textContent = quizData.length;
        }

        // Event Attachments
        nextBtn.addEventListener("click", handleNextButton);
        restartBtn.addEventListener("click", startQuiz);

        // Run on Initial Load
        startQuiz();
    </script>
</body>
</html>
