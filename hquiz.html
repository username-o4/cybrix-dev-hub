<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <style>
        /* [Styles omitted for brevity] */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f5f7fb; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .quiz-container { background-color: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); width: 100%; max-width: 600px; padding: 30px; }
        h1 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
        .options-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
        .option-label { display: flex; align-items: center; background-color: #f8f9fa; border: 2px solid #e2e8f0; border-radius: 8px; padding: 14px 20px; cursor: pointer; }
        .option-label:hover { background-color: #edf2f7; border-color: #4a90e2; }
        .option-label input[type="radio"] { margin-right: 15px; transform: scale(1.3); cursor: pointer; }
        .option-label.selected-bg { background-color: #e3f2fd !important; border-color: #4a90e2 !important; }
        .option-label.correct { background-color: #d4edda !important; border-color: #2ecc71 !important; color: #155724; }
        .option-label.wrong { background-color: #f8d7da !important; border-color: #e74c3c !important; color: #721c24; }
        .next-btn { background-color: #4a90e2; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="quiz-container">
        <h1>HTML & CSS Quiz</h1>
        <div id="quiz-box">
            <div class="options-container" id="options-container">
                <!-- Native Radio Buttons for Selection -->
                <label class="option-label">
                    <input type="radio" name="quiz-option" value="0">
                    <span>Hyper Text Markup Language</span>
                </label>
                <label class="option-label">
                    <input type="radio" name="quiz-option" value="1">
                    <span>Home Tool Markup Language</span>
                </label>
            </div>
            <button class="next-btn" id="next-btn">Submit Answer</button>
        </div>
    </div>
    <script>
        // Simplified JS logic
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.addEventListener('change', (e) => {
            document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected-bg'));
            if(e.target.checked) e.target.closest('.option-label').classList.add('selected-bg');
        });
        document.getElementById('next-btn').addEventListener('click', () => alert('Logic submitted!'));
    </script>
</body>
</html>
