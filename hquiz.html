<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        :root {
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --bg-color: #f5f7fb;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
            padding: 30px;
        }
        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: #2c3e50;
            font-size: 24px;
        }
        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-weight: 600;
            color: #7f8c8d;
        }
        .question-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .option-btn {
            background-color: #f8f9fa;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            width: 100%;
        }
        .option-btn:hover:not([disabled]) {
            background-color: #edf2f7;
            border-color: var(--primary-color);
        }
        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
        }
        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--error-color) !important;
            color: #721c24;
        }
        .controls {
            display: flex;
            justify-content: flex-end;
        }
        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            display: none;
        }
        .result-screen {
            text-align: center;
            display: none;
        }
        .result-screen h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        .score-text {
            font-size: 20px;
            margin-bottom: 24px;
        }
        .restart-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <h1>HTML & CSS Quiz</h1>
        
        <div id="quiz-box">
            <div class="quiz-header">
                <span id="question-counter">Question 1 of 20</span>
                <span id="score-counter">Score: 0</span>
            </div>
            <!-- The first question is now written directly into the HTML structure -->
            <div class="question-text" id="question-text">What does HTML stand for?</div>
            <div class="options-container" id="options-container">
                <!-- Fallback interactive elements built directly into structural template -->
                <button class="option-btn" onclick="selectFallbackAnswer(0, this)">Hyper Text Markup Language</button>
                <button class="option-btn" onclick="selectFallbackAnswer(1, this)">Home Tool Markup Language</button>
                <button class="option-btn" onclick="selectFallbackAnswer(2, this)">Hyperlinks and Text Measurement Language</button>
                <button class="option-btn" onclick="selectFallbackAnswer(3, this)">Hyper Tool Market Language</button>
            </div>
            <div class="controls">
                <button class="next-btn" id="next-btn">Next Question</button>
            </div>
        </div>

        <div id="result-box" class="result-screen">
            <h2>Quiz Completed!</h2>
            <p class="score-text">You scored <span id="final-score">0</span> out of <span id="total-questions">0</span></p>
            <button class="restart-btn" id="restart-btn">Restart Quiz</button>
        </div>
    </div>
